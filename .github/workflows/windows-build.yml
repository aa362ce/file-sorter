name: Build Windows executables

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui]"
          pip install pyinstaller

      - name: Build CLI executable
        run: pyinstaller --onefile --name file-sorter scripts/run_cli.py

      - name: Build GUI executable
        run: pyinstaller --onefile --windowed --name file-sorter-gui scripts/run_gui.py

      - name: Stage artifacts
        run: |
          New-Item -ItemType Directory -Force -Path dist-out
          Copy-Item dist\file-sorter.exe dist-out\
          Copy-Item dist\file-sorter-gui.exe dist-out\

      - uses: actions/upload-artifact@v4
        with:
          name: file-sorter-windows
          path: dist-out/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-out/*
