[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "file-sorter"
version = "0.1.0"
description = "Finds duplicate files across directories"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Ashish" }]
dependencies = ["send2trash>=1.8"]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]

[project.scripts]
file-sorter = "file_sorter.cli:main"

[project.gui-scripts]
file-sorter-gui = "file_sorter.gui.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/file_sorter"]
